services:
  postgres:
    image: postgres:18
    container_name: bookmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookmark_user
      POSTGRES_PASSWORD: bookmark_password
      POSTGRES_DB: bookmark_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
